[package]
name = "apex"
version = "0.1.0"
authors = ["Ghostkeeper"]
description = "Massively parallel geometry operations"
edition = "2024"
repository = "https://github.com/Ghostkeeper/Apex-rs"
license = "AGPL-3.0-or-later"

[dependencies]
auto_ops = "0.3.0"
bytemuck = "1.25.0"
futures-channel = "0.3.32"
pollster = "0.4.0"
rayon = "1.11.0"
wgpu = "28.0.0"
embed-doc-image = "0.1.4"

[dev-dependencies]
assert_float_eq = "1.2.0"
criterion = { version = "0.8.2", features = ["csv_output"] }
test-case = "3.3.1"

[features]
benchmark_internals = []

[[bench]]
name = "translate_polygon"
harness = false

[[bench]]
name = "rotate_polygon"
harness = false

[[bench]]
name = "scale_polygon"
harness = false

[[bench]]
name = "area_polygon"
harness = false